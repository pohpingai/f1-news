# Checks possible new RSS feeds (it changes nothing). Run by hand: Actions -> "Check new feeds" -> Run workflow.
name: Check new feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/check_feeds.py
