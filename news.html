<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 News Daily</title>
  <style>
    :root {
      --bg: #f6f6f7; --card: #ffffff; --text: #16161a; --muted: #62626b;
      --line: #e3e3e8; --accent: #e10600; --note-bg: #fff6e0; --note-text: #6b4a00;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111114; --card: #1b1b20; --text: #ececf1; --muted: #9a9aa5; --line: #2b2b33;
              --note-bg: #3a2f12; --note-text: #f3d48a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header { background: var(--accent); color: #fff; padding: 16px; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.9; }
    main { max-width: 760px; margin: 0 auto; padding: 8px 12px 40px; }

    .views { display: flex; margin: 14px 0 4px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .views button {
      flex: 1; border: 0; background: var(--card); color: var(--text); padding: 10px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .views button.on { background: var(--text); color: var(--bg); }

    .headline-of-day {
      background: var(--card); border-left: 5px solid var(--accent); border-radius: 8px;
      padding: 12px 14px; margin: 14px 0 4px; font-size: 1.05rem; font-weight: 600;
    }
    .headline-of-day small { display: block; color: var(--muted); font-weight: 400; font-size: 0.75rem;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }

    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .filters button {
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
    }
    .filters button.on { background: var(--text); color: var(--bg); border-color: var(--text); }

    h2 { font-size: 1rem; margin: 24px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
    article {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 10px;
    }
    article a.headline { color: var(--text); text-decoration: none; font-weight: 600; font-size: 1.05rem; }
    article a.headline:hover { text-decoration: underline; }
    article h3 { margin: 0; font-size: 1.05rem; }
    .meta { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
    .source { color: var(--accent); font-weight: 600; }
    .snippet, .summary { margin: 6px 0 0; font-size: 0.92rem; color: var(--muted); }
    .summary { color: var(--text); }
    article.merged { border-left: 5px solid var(--accent); }
    .badge { display: inline-block; background: var(--accent); color: #fff; border-radius: 999px;
      font-size: 0.8rem; font-weight: 700; padding: 2px 10px; margin-left: 6px; vertical-align: middle;
      white-space: nowrap; }
    /* Labels on cards: Confirmed / Rumour / Opinion */
    .label { display: inline-block; border-radius: 4px; padding: 1px 7px; margin-bottom: 4px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .label-Confirmed { background: #e3f5e8; color: #17692f; }
    .label-Rumour { background: #fff1d6; color: #8a5300; }
    .label-Opinion { background: #e6eefc; color: #2a4f9a; }
    .label-Active { background: #fff1d6; color: #8a5300; }
    .label-Denied { background: #fde4e4; color: #9b1c1c; }
    .label-Faded { background: var(--line); color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      .label-Confirmed { background: #173d24; color: #8ee0a7; }
      .label-Rumour, .label-Active { background: #3d2e10; color: #f3c46b; }
      .label-Opinion { background: #1c2b4a; color: #9fbdf5; }
      .label-Denied { background: #4a1c1c; color: #f5a3a3; }
    }

    /* Rumours tab */
    .rumour-intro { color: var(--muted); font-size: 0.85rem; margin: 12px 0 0; }
    .trend { font-weight: 700; margin-left: 4px; }
    .trend-rising { color: var(--accent); }
    .trend-steady { color: var(--muted); }
    .trend-fading { color: var(--muted); opacity: 0.7; }
    .people { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .proof { background: var(--bg); border-radius: 6px; padding: 6px 8px; margin-top: 8px; font-size: 0.85rem; }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
    .buttons details[open] { flex-basis: 100%; }
    .history-item { margin: 6px 0; }
    .history-item b { text-transform: capitalize; }

    .note { background: var(--note-bg); color: var(--note-text); border-radius: 6px; padding: 6px 8px;
      font-size: 0.85rem; margin-top: 8px; }
    .links { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.88rem; }
    .links li { margin: 4px 0; }
    .links a { color: var(--text); }
    /* The small "Why grouped?" button. Tapping it opens/closes the AI's reason. */
    details.why { margin-top: 10px; font-size: 0.85rem; }
    details.why summary {
      display: inline-block; list-style: none; cursor: pointer; user-select: none;
      border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px;
      color: var(--muted); background: var(--bg); font-weight: 600;
    }
    details.why summary::-webkit-details-marker { display: none; }
    details.why summary::before { content: "▸ "; }
    details.why[open] summary::before { content: "▾ "; }
    details.why[open] summary { color: var(--text); border-color: var(--text); }
    .why-box { margin-top: 6px; padding: 8px 10px; border-radius: 6px; background: var(--bg); color: var(--text); }
    .why-box p { margin: 2px 0; }
    .message { text-align: center; color: var(--muted); padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1>🏎️ F1 News Daily</h1>
    <p id="updated">Loading…</p>
    <p><a href="costs.html" style="color:#fff">💰 AI costs</a></p>
  </header>
  <main>
    <div class="views">
      <button id="view-cards" class="on">Top stories (AI)</button>
      <button id="view-all">All stories</button>
      <button id="view-rumours">Rumours</button>
    </div>
    <div id="headline"></div>
    <div class="filters" id="filters"></div>
    <div id="news"><p class="message">Loading the latest news…</p></div>
  </main>

  <script>
    // Times are shown in Malaysia time.
    const TIME_ZONE = "Asia/Kuala_Lumpur";

    const dayKey = new Intl.DateTimeFormat("en-CA", { timeZone: TIME_ZONE, year: "numeric", month: "2-digit", day: "2-digit" });
    const dayLabel = new Intl.DateTimeFormat("en-GB", { timeZone: TIME_ZONE, weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const timeLabel = new Intl.DateTimeFormat("en-GB", { timeZone: TIME_ZONE, hour: "2-digit", minute: "2-digit" });

    let allStories = [];
    let cardsData = null;      // stays null if the AI has not made any cards yet
    let view = "cards";        // "cards", "all" or "rumours"
    let rumoursData = null;    // stays null if the rumour tracker has not run yet
    const shortDate = new Intl.DateTimeFormat("en-GB", { timeZone: TIME_ZONE, day: "numeric", month: "short" });
    let chosenSource = "All";

    // Makes text safe to put on the page (stops odd characters breaking it).
    function safe(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    function friendlyDay(date) {
      const today = dayKey.format(new Date());
      const yesterday = dayKey.format(new Date(Date.now() - 86400000));
      const key = dayKey.format(date);
      if (key === today) return "Today · " + dayLabel.format(date);
      if (key === yesterday) return "Yesterday · " + dayLabel.format(date);
      return dayLabel.format(date);
    }

    function storyTime(story) {
      return (story.date_is_seen_time ? "seen at " : "") + timeLabel.format(new Date(story.date));
    }

    // Puts a day heading ("Today · ...") above the first item of each day.
    function groupByDay(items, getDate, render) {
      let html = "", currentDay = "";
      for (const item of items) {
        const date = new Date(getDate(item));
        const key = dayKey.format(date);
        if (key !== currentDay) {
          currentDay = key;
          html += `<h2>${safe(friendlyDay(date))}</h2>`;
        }
        html += render(item);
      }
      return html;
    }

    // ---------- "All stories" view (the same as before the AI) ----------

    function showFilters() {
      const box = document.getElementById("filters");
      box.innerHTML = "";
      if (view !== "all") return;
      const sources = ["All", ...[...new Set(allStories.map(s => s.source))].sort()];
      for (const source of sources) {
        const button = document.createElement("button");
        button.textContent = source;
        button.className = source === chosenSource ? "on" : "";
        button.onclick = () => { chosenSource = source; show(); };
        box.appendChild(button);
      }
    }

    function showAllStories() {
      const stories = allStories
        .filter(s => chosenSource === "All" || s.source === chosenSource)
        .sort((a, b) => b.date.localeCompare(a.date)); // newest first
      if (stories.length === 0) return '<p class="message">No stories yet.</p>';
      return groupByDay(stories, s => s.date, story => `
        <article>
          <a class="headline" href="${safe(story.link)}" target="_blank" rel="noopener">${safe(story.title)}</a>
          <div class="meta"><span class="source">${safe(story.source)}</span> · ${storyTime(story)}</div>
          ${story.snippet ? `<p class="snippet">${safe(story.snippet)}</p>` : ""}
        </article>`);
    }

    // ---------- "Top stories (AI)" view ----------

    function cardDate(card) {
      return card.stories.map(s => s.date).sort().pop();
    }

    function showCards() {
      if (!cardsData || !cardsData.cards.length) {
        return '<p class="message">The AI has not grouped any stories yet. Try "All stories".</p>';
      }
      // Order: newest day first. Inside each day, cards with the most sources come first,
      // then the newest. (Day headings are added by groupByDay.)
      const sourceCount = card => new Set(card.stories.map(s => s.source)).size;
      const cards = [...cardsData.cards].sort((a, b) =>
        dayKey.format(new Date(cardDate(b))).localeCompare(dayKey.format(new Date(cardDate(a)))) ||
        sourceCount(b) - sourceCount(a) ||
        b.stories.length - a.stories.length ||
        cardDate(b).localeCompare(cardDate(a)));
      return groupByDay(cards, cardDate, card => {
        const stories = [...card.stories].sort((a, b) => a.date.localeCompare(b.date));
        const sourceCount = new Set(stories.map(s => s.source)).size;
        const merged = stories.length > 1;
        const badgeText = sourceCount > 1 ? `${sourceCount} sources` : `${stories.length} stories`;
        const badge = merged ? `<span class="badge">${badgeText}</span>` : "";
        const links = stories.map(s => `
          <li><span class="source">${safe(s.source)}</span> ·
            <a href="${safe(s.link)}" target="_blank" rel="noopener">${safe(s.title)}</a>
            <span class="meta">(${storyTime(s)})</span></li>`).join("");
        const reasons = (card.merge_reasons || []).map(r => `<p>🤖 ${safe(r.reason)}</p>`).join("");
        return `
          <article class="${merged ? "merged" : ""}">
            ${card.label ? `<span class="label label-${safe(card.label)}">${safe(card.label)}</span>` : ""}
            <h3>${safe(card.title)}${badge}</h3>
            <p class="summary">${safe(card.summary)}</p>
            ${card.disagreement ? `<div class="note">⚠️ Sources disagree: ${safe(card.disagreement)}</div>` : ""}
            <ul class="links">${links}</ul>
            ${reasons ? `<details class="why"><summary>Why grouped?</summary><div class="why-box">${reasons}</div></details>` : ""}
          </article>`;
      });
    }

    function showHeadline() {
      const box = document.getElementById("headline");
      const h = cardsData && cardsData.headline_of_the_day;
      box.innerHTML = (view === "cards" && h && h.text)
        ? `<div class="headline-of-day"><small>Headline of the day · ${safe(h.date)}</small>${safe(h.text)}</div>`
        : "";
    }

    // ---------- "Rumours" view (the rumour tracker's memory) ----------

    const TREND_ARROW = { rising: "↑ rising", steady: "→ steady", fading: "↓ fading" };
    const STATUS_ORDER = { Active: 0, Confirmed: 1, Denied: 2, Faded: 3 };
    const TREND_ORDER = { rising: 0, steady: 1, fading: 2 };

    function showRumours() {
      if (!rumoursData || !rumoursData.rumours.length) {
        return '<p class="message">No rumours tracked yet.</p>';
      }
      // Active rumours first (rising first, then most sources), then Confirmed, Denied, Faded.
      const rumours = [...rumoursData.rumours].sort((a, b) =>
        (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9) ||
        (TREND_ORDER[a.trend] ?? 9) - (TREND_ORDER[b.trend] ?? 9) ||
        b.sources.length - a.sources.length ||
        b.last_seen.localeCompare(a.last_seen));

      let html = `<p class="rumour-intro">The AI keeps track of rumours across days. A rumour only becomes
        "Confirmed" when an official source says so. Trend arrows compare the last 2 days with the 2 days before.</p>`;
      let currentStatus = "";
      for (const r of rumours) {
        if (r.status !== currentStatus) {
          currentStatus = r.status;
          const count = rumours.filter(x => x.status === r.status).length;
          html += `<h2>${safe(r.status)} (${count})</h2>`;
        }
        const sourceCount = r.sources.length;
        const trend = r.status === "Active"
          ? `<span class="trend trend-${safe(r.trend)}">${safe(TREND_ARROW[r.trend] || "")}</span>` : "";
        const people = r.people && r.people.length ? `<div class="people">👥 ${safe(r.people.join(", "))}</div>` : "";
        const proof = r.proof ? `
          <div class="proof">${r.status === "Denied" ? "❌ Officially denied" : "✅ Officially confirmed"}:
            “${safe(r.proof.evidence)}”
            ${r.proof.links.map(l => `<br><a href="${safe(l.link)}" target="_blank" rel="noopener">${safe(l.source)}: ${safe(l.title)}</a>`).join("")}
          </div>` : "";
        const sources = [...r.sources].sort((a, b) => b.date.localeCompare(a.date)).map(s => `
          <li><span class="source">${safe(s.source)}</span> ·
            <a href="${safe(s.link)}" target="_blank" rel="noopener">${safe(s.title)}</a>
            <span class="meta">(${shortDate.format(new Date(s.date))})</span></li>`).join("");
        const historyItems = [...r.history].reverse().map(h => `
          <div class="history-item">🕒 ${shortDate.format(new Date(h.time))}, ${timeLabel.format(new Date(h.time))} ·
            <b>${safe(h.event)}</b>: ${safe(h.detail)}
            ${h.reason ? `<br>🤖 ${safe(h.reason)}` : ""}</div>`).join("");
        html += `
          <article class="${r.status === "Active" ? "merged" : ""}">
            <span class="label label-${safe(r.status)}">${safe(r.status)}</span>${trend}
            <h3>${safe(r.claim)}</h3>
            ${people}
            <div class="meta">${sourceCount} source${sourceCount === 1 ? "" : "s"} ·
              first seen ${shortDate.format(new Date(r.first_seen))} · last seen ${shortDate.format(new Date(r.last_seen))}</div>
            ${proof}
            <div class="buttons">
              <details class="why"><summary>Sources (${sourceCount})</summary><div class="why-box"><ul class="links">${sources}</ul></div></details>
              <details class="why"><summary>History</summary><div class="why-box">${historyItems}</div></details>
            </div>
          </article>`;
      }
      return html;
    }

    // ---------- Switching views ----------

    function show() {
      document.getElementById("view-cards").className = view === "cards" ? "on" : "";
      document.getElementById("view-all").className = view === "all" ? "on" : "";
      document.getElementById("view-rumours").className = view === "rumours" ? "on" : "";
      showHeadline();
      showFilters();
      document.getElementById("news").innerHTML =
        view === "cards" ? showCards() : view === "rumours" ? showRumours() : showAllStories();
    }
    document.getElementById("view-cards").onclick = () => { view = "cards"; show(); };
    document.getElementById("view-all").onclick = () => { view = "all"; show(); };
    document.getElementById("view-rumours").onclick = () => { view = "rumours"; show(); };

    // ---------- Loading the data ----------

    Promise.all([
      fetch("data/news.json", { cache: "no-store" }).then(r => r.json()),
      // cards.json may not exist yet (e.g. no AI key) — that's fine, we just show all stories.
      fetch("data/cards.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch("data/rumours.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null),
    ]).then(([news, cards, rumours]) => {
      allStories = news.stories || [];
      cardsData = cards;
      rumoursData = rumours;
      if (!cardsData || !cardsData.cards || !cardsData.cards.length) view = "all";
      const updated = new Date(news.updated);
      const cardCount = cardsData ? cardsData.cards.length : 0;
      document.getElementById("updated").textContent =
        `${allStories.length} stories` + (cardCount ? ` · ${cardCount} AI cards` : "") +
        ` · updated ${dayLabel.format(updated)}, ${timeLabel.format(updated)} (Malaysia time)`;
      show();
    }).catch(() => {
      document.getElementById("updated").textContent = "";
      document.getElementById("news").innerHTML = '<p class="message">Sorry, the news could not be loaded.</p>';
    });
  </script>
</body>
</html>
